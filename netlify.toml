# Build settings for the site on Netlify. Both Netlify projects (the live site
# and the preview site) build from this file; the only per-project setting is
# the PUBLIC_ENVIRONMENT variable in the Netlify UI.
#
# Project configuration in the Netlify UI:
#   Base directory:    (empty: the repo root, where the lockfile is)
#   Package directory: packages/client
#
# The package directory is what makes Netlify pick up the serverless function
# that adapter-netlify writes to packages/client/.netlify/functions-internal.
#
# This file lives at the repo root on purpose. Netlify resolves the paths
# below against the base directory. adapter-netlify also reads a netlify.toml,
# but from the package directory and relative to it, so one publish path can't
# satisfy both when the file sits next to the package. With no netlify.toml
# there, the adapter writes to its default, packages/client/build, which is
# what Netlify publishes.
[build]
  command = "pnpm --filter client build"
  publish = "packages/client/build"

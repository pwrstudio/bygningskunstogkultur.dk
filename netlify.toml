# Build settings for the site on Netlify. Both Netlify projects (the live site
# and the preview site) build from this file; the only per-project setting is
# the PUBLIC_ENVIRONMENT variable in the Netlify UI.
#
# Project configuration in the Netlify UI:
#   Base directory:    (empty: the repo root, where the lockfile is)
#   Package directory: packages/client
#
# The package directory is what makes Netlify pick up what adapter-netlify
# writes to packages/client/.netlify/v1: the render function and its config
# (Netlify Frameworks API).
#
# Paths below are relative to the base directory. The adapter writes the
# static files to its default publish directory, build/ inside the package,
# which is what Netlify publishes.
[build]
  command = "pnpm --filter client build"
  publish = "packages/client/build"
